spring:
  application:
    name: marketplace-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS marketplace
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: MarketplaceHikariPool
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: marketplace
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET:marketplace-system-dev-secret-key-change-me-in-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Comma-separated list of allowed origins. "*" (default) allows any
    # origin and is intended for local development; override with
    # CORS_ALLOWED_ORIGINS in production.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  bootstrap:
    # Admin account seeded on startup when none exists. Override both in
    # production (application-prod.yml requires ADMIN_INITIAL_PASSWORD).
    admin-email: ${ADMIN_INITIAL_EMAIL:admin@marketplace.com}
    admin-password: ${ADMIN_INITIAL_PASSWORD:AdminPass123}

server:
  port: 8080
  error:
    include-message: never
