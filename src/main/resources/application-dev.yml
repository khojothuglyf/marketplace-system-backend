# Embedded in-memory H2 profile (PostgreSQL compatibility mode).
# Lets the whole backend run self-contained with no external database:
#
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=dev"
#
# The H2 URL uses MODE=PostgreSQL so DDL/DQL behave like Postgres, and an
# INIT script creates the `marketplace` schema Hibernate expects.
spring:
  datasource:
    url: jdbc:h2:mem:marketplace;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS marketplace
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      # Override the Postgres-specific init SQL from application.yml.
      connection-init-sql: ""
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate.SQL: info
