# Production profile.
# Every secret below is REQUIRED from the environment - startup fails fast
# when a value is missing instead of falling back to an insecure default.
# Set them via environment variables (see DEPLOYMENT.md / docker-compose.yml).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Kept as "update" per project decision: Hibernate owns the schema
      # (single-instance deployment, no concurrent migrations). Review this
      # when adding multi-node deployments.
      ddl-auto: update
    show-sql: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/plain

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Comma-separated list of frontend origins allowed to call the API,
    # e.g. CORS_ALLOWED_ORIGINS=https://shop.example.com,https://admin.example.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  bootstrap:
    admin-email: ${ADMIN_INITIAL_EMAIL:admin@marketplace.com}
    admin-password: ${ADMIN_INITIAL_PASSWORD}

# Actuator - minimal, non-sensitive exposure for orchestration health checks.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# Swagger/OpenAPI is off in production unless explicitly enabled.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

logging:
  level:
    root: INFO
    com.marketplacesystem: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
  file:
    name: ${LOG_FILE:logs/marketplace-system.log}
